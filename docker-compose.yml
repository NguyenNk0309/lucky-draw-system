name: lucky-draw

x-backend-environment: &backend-environment
  DB_USER: lucky
  DB_PASSWORD: lucky
  KAFKA_BOOTSTRAP_SERVERS: redpanda:9092

x-backend-healthcheck: &backend-healthcheck
  interval: 5s
  timeout: 3s
  retries: 30
  start_period: 20s

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql-data-v2:/var/lib/mysql
      - ./deploy/mysql-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    ports:
      - "6380:6379"
    volumes:
      - redis-data-v2:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  redpanda:
    image: redpandadata/redpanda:v24.3.7
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
    volumes:
      - redpanda-data-v2:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy.*true'"]
      interval: 5s
      timeout: 5s
      retries: 30

  order-service:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args: { MODULE: order-service }
    environment:
      <<: *backend-environment
      DB_URL: jdbc:mysql://mysql:3306/orders?useSSL=false&allowPublicKeyRetrieval=true
    ports:
      - "18081:8081"
    depends_on:
      mysql: { condition: service_healthy }
      redpanda: { condition: service_healthy }
    healthcheck:
      <<: *backend-healthcheck
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health"]

  lucky-draw-service:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args: { MODULE: lucky-draw-service }
    environment:
      <<: *backend-environment
      DB_URL: jdbc:mysql://mysql:3306/luckydraw?useSSL=false&allowPublicKeyRetrieval=true
    ports:
      - "18082:8082"
    depends_on:
      mysql: { condition: service_healthy }
      redpanda: { condition: service_healthy }
    healthcheck:
      <<: *backend-healthcheck
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/actuator/health"]

  campaign-service:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args: { MODULE: campaign-service }
    environment:
      <<: *backend-environment
      DB_URL: jdbc:mysql://mysql:3306/luckydraw?useSSL=false&allowPublicKeyRetrieval=true
    ports:
      - "18083:8083"
    depends_on:
      lucky-draw-service: { condition: service_healthy }
    healthcheck:
      <<: *backend-healthcheck
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/actuator/health"]

  analytics-service:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args: { MODULE: analytics-service }
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      REDIS_HOST: redis
    ports:
      - "18085:8085"
    depends_on:
      redis: { condition: service_healthy }
      redpanda: { condition: service_healthy }
    healthcheck:
      <<: *backend-healthcheck
      test: ["CMD", "wget", "-qO-", "http://localhost:8085/actuator/health"]

  notification-service:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args: { MODULE: notification-service }
    environment:
      <<: *backend-environment
      DB_URL: jdbc:mysql://mysql:3306/notifications?useSSL=false&allowPublicKeyRetrieval=true
    depends_on:
      mysql: { condition: service_healthy }
      redpanda: { condition: service_healthy }
    healthcheck:
      <<: *backend-healthcheck
      test: ["CMD", "wget", "-qO-", "http://localhost:8086/actuator/health"]

  reward-service:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args: { MODULE: reward-service }
    environment:
      <<: *backend-environment
      DB_URL: jdbc:mysql://mysql:3306/rewards?useSSL=false&allowPublicKeyRetrieval=true
    depends_on:
      mysql: { condition: service_healthy }
      redpanda: { condition: service_healthy }
    healthcheck:
      <<: *backend-healthcheck
      test: ["CMD", "wget", "-qO-", "http://localhost:8087/actuator/health"]

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args: { MODULE: api-gateway }
    environment:
      DEMO_AUTH_SECRET: local-compose-secret-change-in-production
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      ORDER_SERVICE_URL: http://order-service:8081
      CAMPAIGN_SERVICE_URL: http://campaign-service:8083
      LUCKY_DRAW_SERVICE_URL: http://lucky-draw-service:8082
      ANALYTICS_SERVICE_URL: http://analytics-service:8085
      NOTIFICATION_SERVICE_URL: http://notification-service:8086
      REWARD_SERVICE_URL: http://reward-service:8087
    ports:
      - "18080:8080"
    depends_on:
      order-service: { condition: service_healthy }
      campaign-service: { condition: service_healthy }
      lucky-draw-service: { condition: service_healthy }
      analytics-service: { condition: service_healthy }
      notification-service: { condition: service_healthy }
      reward-service: { condition: service_healthy }
      redpanda: { condition: service_healthy }
    healthcheck:
      <<: *backend-healthcheck
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8080:80"
    depends_on:
      api-gateway: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql-data-v2:
  redis-data-v2:
  redpanda-data-v2:
