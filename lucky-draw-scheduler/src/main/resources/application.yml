server:
  port: ${SERVER_PORT:8084}
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/luckydraw?useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USER:lucky}
    password: ${DB_PASSWORD:lucky}
management:
  endpoints.web.exposure.include: health,info
  endpoint.health.probes.enabled: true

