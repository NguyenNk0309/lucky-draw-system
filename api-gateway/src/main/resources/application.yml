server.port: ${SERVER_PORT:8080}
demo-auth:
  secret: ${DEMO_AUTH_SECRET:local-only-change-me-please}
  customer-password: ${DEMO_CUSTOMER_PASSWORD:customer123}
  seller-password: ${DEMO_SELLER_PASSWORD:seller123}
gateway:
  requests-per-minute: ${REQUESTS_PER_MINUTE:120}
  order-url: ${ORDER_SERVICE_URL:http://localhost:8081}
  campaign-url: ${CAMPAIGN_SERVICE_URL:http://localhost:8083}
  lucky-draw-url: ${LUCKY_DRAW_SERVICE_URL:http://localhost:8082}
  analytics-url: ${ANALYTICS_SERVICE_URL:http://localhost:8085}
  notification-url: ${NOTIFICATION_SERVICE_URL:http://localhost:8086}
  reward-url: ${REWARD_SERVICE_URL:http://localhost:8087}
management:
  endpoints.web.exposure.include: health,info
  endpoint.health.probes.enabled: true
